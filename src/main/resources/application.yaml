spring:
  application:
    name: concurrent-savings

  profiles:
    default: local

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

  jackson:
    time-zone: Asia/Seoul
    datatype:
      datetime:
        write-dates-as-timestamps: false
