spring:
  datasource:
    url: jdbc:mysql://localhost:3310/concurrent_savings?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&rewriteBatchedStatements=true
    username: savings
    password: savings
    hikari:
      pool-name: concurrent-savings-pool
      maximum-pool-size: 10

  data:
    redis:
      host: localhost
      port: 6379

  jpa:
    show-sql: true

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
